version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait 7 days after a release before opening a PR for it
    cooldown:
      default-days: 7

    # 1. Block Major Updates
    ignore:
      # Ignore all major version bumps to avoid breaking changes
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    # 2. Group Minor/Patch Updates
    # One PR for all minor/patch updates, and one for security updates
    groups:
      # Security updates skip the cooldown
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"