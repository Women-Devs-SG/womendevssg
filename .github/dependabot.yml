version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before opening a PR for it
    cooldown:
      default-days: 7

    # 1. Block Major Updates
    ignore:
      # Ignore all major version bumps to avoid breaking changes
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    # 2. Group Minor/Patch Updates
    # This combines all @astrojs updates into one PR so you don't get 5 separate alerts
    groups:
      astro-ecosystem:
        patterns:
          - "astro"
          - "@astrojs/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "@astrojs/react"
      eslint-ecosystem:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "astro-eslint-parser"
          - "globals"
      tailwind-ecosystem:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@astrojs/tailwind"
          - "prettier-plugin-tailwindcss"
      other-minor-patch:
        patterns:
          - "*"